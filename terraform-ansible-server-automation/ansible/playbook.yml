---
- name: Configure application server
  hosts: app_server

  tasks:
    - name: Install Nginx and curl
      ansible.builtin.apt:
        name:
          - nginx
          - curl
        state: present
        update_cache: true

    - name: Create application user
      ansible.builtin.user:
        name: appuser
        state: present
        shell: /bin/bash

    - name: Configure application web page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head><title>DevOps Application Server</title></head>
          <body>
            <h1>DevOps Server Updated by Ansible</h1>
            <p>Terraform provisioned the server and Ansible configured it.</p>
          </body>
          </html>
        mode: "0644"

    - name: Start Nginx
      ansible.builtin.shell: |
        if [ -f /run/nginx.pid ] && kill -0 "$(cat /run/nginx.pid)" 2>/dev/null; then
          nginx -s reload
        else
          nginx
        fi

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
